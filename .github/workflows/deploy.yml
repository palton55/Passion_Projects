name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 4am Hawaii time, so edits to the synced Google Maps lists show up (scripts/sync_gmaps.mjs).
  schedule:
    - cron: '0 14 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized photos and snapped roads carry over between builds, so each build only makes what's new.
      - uses: actions/cache@v4
        with:
          path: |
            public/sized
            .cache
          key: site-build-${{ github.run_id }}
          restore-keys: site-build-
      - name: Build
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          export SITE="https://${OWNER}.github.io"
          if [ "${REPO,,}" != "${OWNER}.github.io" ]; then export BASE="/${REPO}"; fi
          npm run build
          # Alpha copy with drafts, served at <site>/alpha/
          BASE="${BASE:-}/alpha" PUBLIC_SHOW_DRAFTS=true npx astro build --outDir dist-alpha
          mv dist-alpha dist/alpha
          node scripts/snap_roads.mjs dist dist/alpha
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
